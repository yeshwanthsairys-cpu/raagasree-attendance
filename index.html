
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raagasree E.M High School - Staff Attendance</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f4fa;
      color: #183153;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 25px auto;
      padding: 28px 24px;
      background: #fff;
      border-radius: 16px;
      border-top: 5px solid #c59a43;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 29px;
      margin: 0 0 4px;
      color: #183153;
      letter-spacing: 1px;
    }

    .school-name {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin: 0 auto 14px;
      color: #183153;
      letter-spacing: .5px;
    }

    .subtitle {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 16px;
      margin: 0 0 28px;
      color: #a57922;
      font-weight: bold;
      letter-spacing: .5px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .in-button { background: #16834a; }
    .out-button { background: #2458b8; }
    .capture-button { background: #a57922; }
    .cancel-button { background: #64748b; }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #cameraPanel {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    #video, #preview {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
      background: #172033;
    }

    #preview { display: none; }

    .camera-note {
      font-size: 13px;
      color: #596579;
      line-height: 1.5;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .note {
      font-size: 13px;
      color: #596579;
      text-align: center;
      margin-top: 22px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>RAAGASREE</h1>
    <h2 class="school-name">E.M HIGH SCHOOL</h2>
    <p class="subtitle">STAFF ATTENDANCE 2026–27</p>

    <form
      id="attendanceForm"
      action="https://script.google.com/macros/s/AKfycbxOCdt1KMDUa0GwAY3VdnkC9tnNa8akXSsTqkh9TM5_rHFb-5g5Vdg71_LTlTZYno28ww/exec"
      method="POST"
      onsubmit="return false;"
    >
      <label for="teacherId">Teacher ID</label>
      <input
        id="teacherId"
        name="teacherId"
        type="text"
        placeholder="Enter your Teacher ID"
        required
        autocomplete="username"
      >

      <label for="pin">Attendance PIN</label>
      <input
        id="pin"
        name="pin"
        type="password"
        placeholder="Enter your Attendance PIN"
        required
        autocomplete="current-password"
      >

      <input type="hidden" name="action" id="action">
      <input type="hidden" name="latitude" id="latitude">
      <input type="hidden" name="longitude" id="longitude">
      <input type="hidden" name="accuracy" id="accuracy">
      <input type="hidden" name="selfie" id="selfie">

      <div id="punchButtons">
        <button type="button" class="in-button"
          onclick="beginAttendance('IN')">
          IN-PUNCH
        </button>

        <button type="button" class="out-button"
          onclick="beginAttendance('OUT')">
          OUT-PUNCH
        </button>
      </div>

      <section id="cameraPanel">
        <p id="cameraHeading"><b>Take your attendance selfie</b></p>
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" alt="Captured attendance selfie">
        <canvas id="canvas" style="display:none"></canvas>

        <p class="camera-note">
          Make sure your face is clearly visible. Your selfie will be
          submitted with your attendance.
        </p>

        <button type="button" id="captureButton"
          class="capture-button" onclick="captureSelfie()">
          Capture Selfie
        </button>

        <button type="button" id="retakeButton"
          class="capture-button" style="display:none"
          onclick="retakeSelfie()">
          Retake Selfie
        </button>

        <button type="button" class="cancel-button"
          onclick="cancelAttendance()">
          Cancel
        </button>
      </section>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="note">
      Allow camera and location access. Mark attendance while at school.
    </p>
  </main>

  <script>
    let pendingAction = "";
    let cameraStream = null;
    let submitting = false;

    const form = document.getElementById("attendanceForm");
    const message = document.getElementById("message");
    const video = document.getElementById("video");
    const preview = document.getElementById("preview");
    const cameraPanel = document.getElementById("cameraPanel");
    const captureButton = document.getElementById("captureButton");
    const retakeButton = document.getElementById("retakeButton");

    function setMessage(text) {
      message.textContent = text;
    }

    async function beginAttendance(action) {
      if (submitting) return;
      if (!form.reportValidity()) return;

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        setMessage(
          "Camera access is unavailable. Open the website using HTTPS in a supported browser."
        );
        return;
      }

      pendingAction = action;
      document.getElementById("action").value = action;
      document.getElementById("selfie").value = "";

      document.getElementById("punchButtons").style.display = "none";
      cameraPanel.style.display = "block";
      video.style.display = "block";
      preview.style.display = "none";
      captureButton.style.display = "block";
      retakeButton.style.display = "none";

      document.getElementById("cameraHeading").textContent =
        action === "IN"
          ? "IN-PUNCH: Take your selfie"
          : "OUT-PUNCH: Take your selfie";

      setMessage("Opening camera. Please allow camera access...");

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();
        setMessage("Position your face and capture your selfie.");
      } catch (error) {
        stopCamera();
        cameraPanel.style.display = "none";
        document.getElementById("punchButtons").style.display = "block";
        setMessage(
          "Unable to open the camera. Allow camera permission in your browser and try again."
        );
      }
    }

    function captureSelfie() {
      if (!video.videoWidth || !video.videoHeight) {
        setMessage("Camera is not ready. Please wait and try again.");
        return;
      }

      const canvas = document.getElementById("canvas");
      const maxWidth = 480;
      const scale = Math.min(1, maxWidth / video.videoWidth);

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const context = canvas.getContext("2d");
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const selfieData = canvas.toDataURL("image/jpeg", 0.6);

      if (selfieData.length > 1500000) {
        setMessage("Photo is too large. Please retake the selfie.");
        return;
      }

      document.getElementById("selfie").value = selfieData;
      preview.src = selfieData;
      preview.style.display = "block";
      video.style.display = "none";
      captureButton.style.display = "none";
      retakeButton.style.display = "block";

      stopCamera();
      submitWithLocation();
    }

    function retakeSelfie() {
      document.getElementById("selfie").value = "";
      preview.style.display = "none";
      beginAttendance(pendingAction);
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      video.srcObject = null;
    }

    function cancelAttendance() {
      stopCamera();
      submitting = false;
      pendingAction = "";
      cameraPanel.style.display = "none";
      document.getElementById("punchButtons").style.display = "block";
      document.getElementById("selfie").value = "";
      setMessage("Attendance cancelled.");
    }

    function submitWithLocation() {
      if (!navigator.geolocation) {
        setMessage("Your browser does not support GPS location.");
        captureButton.style.display = "block";
        retakeButton.style.display = "block";
        return;
      }

      submitting = true;
      captureButton.disabled = true;
      retakeButton.disabled = true;

      setMessage("Selfie captured. Checking your GPS location...");

      navigator.geolocation.getCurrentPosition(
        function(position) {
          document.getElementById("latitude").value =
            position.coords.latitude;
          document.getElementById("longitude").value =
            position.coords.longitude;
          document.getElementById("accuracy").value =
            position.coords.accuracy;

          setMessage("Submitting attendance and selfie...");

          // Submit the captured selfie and GPS with the attendance form.
          form.submit();
        },
        function(error) {
          submitting = false;
          captureButton.disabled = false;
          retakeButton.disabled = false;

          if (error.code === 1) {
            setMessage(
              "Location permission denied. Allow location access and try again."
            );
          } else if (error.code === 3) {
            setMessage("Location request timed out. Please try again.");
          } else {
            setMessage("Unable to get your location. Turn on GPS and try again.");
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
