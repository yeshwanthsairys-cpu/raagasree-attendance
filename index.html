
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raagasree Staff Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f4fa; color: #183153;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: white; padding: 28px 22px;
      border-radius: 16px; width: 100%; max-width: 410px;
      box-shadow: 0 4px 22px #00000012;
    }
    h1 { text-align: center; color: #123d70; font-size: 23px; }
    .subtitle { text-align: center; margin-bottom: 25px; }
    label { display: block; margin: 16px 0 7px; font-weight: bold; }
    input {
      width: 100%; padding: 13px; border: 1px solid #ccd5e0;
      border-radius: 8px; font-size: 16px;
    }
    button {
      width: 100%; padding: 14px; margin-top: 22px;
      background: #123d70; color: white; border: 0;
      border-radius: 8px; font-size: 16px; font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { text-align: center; margin-top: 16px; line-height: 1.5; }
    .note { font-size: 12px; color: #596579; text-align: center; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>RAAGASREE E.M HIGH SCHOOL</h1>
    <p class="subtitle">Staff Attendance System</p>

    <form id="attendanceForm"
      action="https://script.google.com/macros/s/AKfycbxOCdt1KMDUa0GwAY3VdnkC9tnNa8akXSsTqkh9TM5_rHFb-5g5Vdg71_LTlTZYno28ww/exec"
      method="post">

      <label for="teacherId">Teacher ID</label>
      <input id="teacherId" name="teacherId"
        type="text" required autocomplete="username"
        placeholder="Enter your Teacher ID">

      <label for="pin">Attendance PIN</label>
      <input id="pin" name="pin" type="password"
        required autocomplete="current-password"
        placeholder="Enter your PIN">

      <input type="hidden" name="latitude" id="latitude">
      <input type="hidden" name="longitude" id="longitude">
      <input type="hidden" name="accuracy" id="accuracy">

      <button id="submitButton" type="submit">Verify Location & Check In</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="note">
      Allow location access when prompted. Attendance is accepted only
      when the location meets the school's configured GPS requirements.
    </p>
  </main>

  <script>
    const form = document.getElementById("attendanceForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");
    let submitting = false;

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (submitting || !form.reportValidity()) return;

      if (!navigator.geolocation) {
        status.textContent = "Your browser does not support GPS location.";
        return;
      }

      submitting = true;
      button.disabled = true;
      status.textContent = "Getting your location. Please wait...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          document.getElementById("latitude").value =
            position.coords.latitude;
          document.getElementById("longitude").value =
            position.coords.longitude;
          document.getElementById("accuracy").value =
            position.coords.accuracy;

          status.textContent = "Submitting attendance...";
          form.submit();
        },
        function(error) {
          submitting = false;
          button.disabled = false;

          if (error.code === 1) {
            status.textContent =
              "Location permission denied. Allow location access in your browser settings.";
          } else if (error.code === 3) {
            status.textContent =
              "Location request timed out. Try again with GPS enabled.";
          } else {
            status.textContent =
              "Unable to get your location. Enable GPS and try again.";
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });
  </script>
</body>
</html>
