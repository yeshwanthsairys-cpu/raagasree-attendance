
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raagasree Staff Attendance</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 12px;
      background: #f3f6fa;
      color: #172b45;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 440px;
      margin: 0 auto;
      padding: 26px 24px;
      background: #fff;
      border: 1px solid #e0e6ee;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(22, 43, 69, .08);
    }

    .school-header {
      text-align: center;
      padding: 4px 0 20px;
      margin-bottom: 20px;
      border-bottom: 2px solid #c8a34d;
    }

    .school-name {
      margin: 0;
      color: #15365b;
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 800;
      letter-spacing: 1.5px;
      line-height: 1.15;
      text-align: center;
    }

    .school-location {
      margin: 7px 0 0;
      color: #263b54;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #68778b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-align: center;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }
    .capture { background: #e9eff8; color: #173e70; }
    .in { background: #167447; color: white; }
    .out { background: #173e70; color: white; }

    #cameraArea { margin-top: 16px; display: none; }

    video, #preview {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      background: #111827;
    }

    #preview { display: none; }

    #message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .small {
      margin-top: 16px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="school-header">
      <h1 class="school-name">RAAGASREE</h1>
      <p class="school-location">E.M HIGH SCHOOL, V. KOTA</p>
      <p class="subtitle">Staff Attendance · 2026–27</p>
    </header>

    <form id="attendanceForm"
          action="https://script.google.com/macros/s/AKfycbxOCdt1KMDUa0GwAY3VdnkC9tnNa8akXSsTqkh9TM5_rHFb-5g5Vdg71_LTlTZYno28ww/exec"
          method="POST"
          target="_self">

      <label for="teacherId">Teacher ID</label>
      <input id="teacherId" name="teacherId" required autocomplete="username">

      <label for="pin">Attendance PIN</label>
      <input id="pin" name="pin" type="password" required
             inputmode="numeric" autocomplete="current-password">

      <input type="hidden" id="action" name="action" value="">
      <input type="hidden" id="latitude" name="latitude">
      <input type="hidden" id="longitude" name="longitude">
      <input type="hidden" id="accuracy" name="accuracy">
      <input type="hidden" id="selfie" name="selfie">

      <div id="cameraArea">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" hidden></canvas>
        <img id="preview" alt="Captured attendance selfie">
        <button type="button" class="capture" id="captureButton"
                onclick="captureSelfie()">Capture Selfie</button>
        <button type="button" class="capture" id="retakeButton"
                onclick="retakeSelfie()" hidden>Retake Selfie</button>
      </div>

      <button type="button" class="in" id="inButton"
              onclick="startAttendance('IN')">Punch IN</button>
      <button type="button" class="out" id="outButton"
              onclick="startAttendance('OUT')">Punch OUT</button>
    </form>

    <div id="message" role="status" aria-live="polite">
      Enter your Teacher ID and PIN, then select Punch IN or Punch OUT.
    </div>

    <p class="small">
      Enable your phone's camera and location permissions.
      Attendance is accepted only within the permitted school area.
    </p>
  </main>

  <script>
    const form = document.getElementById("attendanceForm");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const selfieInput = document.getElementById("selfie");
    const message = document.getElementById("message");
    const cameraArea = document.getElementById("cameraArea");
    const captureButton = document.getElementById("captureButton");
    const retakeButton = document.getElementById("retakeButton");
    const inButton = document.getElementById("inButton");
    const outButton = document.getElementById("outButton");

    let cameraStream = null;
    let pendingAction = "";
    let submitting = false;

    function showMessage(text) {
      message.textContent = text;
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      video.srcObject = null;
    }

    async function startAttendance(action) {
      if (submitting) return;
      if (!form.reportValidity()) return;

      pendingAction = action;
      selfieInput.value = "";
      preview.style.display = "none";
      video.style.display = "block";
      captureButton.hidden = false;
      retakeButton.hidden = true;
      cameraArea.style.display = "block";
      inButton.disabled = true;
      outButton.disabled = true;

      showMessage("Opening camera. Please allow camera access.");

      try {
        stopCamera();
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = cameraStream;
        await video.play();
        showMessage("Camera ready. Capture your selfie.");
      } catch (err) {
        showMessage("Camera could not open. Allow camera permission and try again.");
        inButton.disabled = false;
        outButton.disabled = false;
      }
    }

    function captureSelfie() {
      if (!video.videoWidth || !video.videoHeight) {
        showMessage("Camera is not ready yet. Please wait a moment.");
        return;
      }

      const scale = Math.min(1, 480 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const context = canvas.getContext("2d");
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      selfieInput.value = canvas.toDataURL("image/jpeg", 0.6);
      preview.src = selfieInput.value;
      preview.style.display = "block";
      video.style.display = "none";
      captureButton.hidden = true;
      retakeButton.hidden = false;

      stopCamera();
      showMessage("Selfie captured. Getting your GPS location…");
      getLocationAndSubmit();
    }

    function retakeSelfie() {
      selfieInput.value = "";
      startAttendance(pendingAction);
    }

    function getLocationAndSubmit() {
      if (!navigator.geolocation) {
        showMessage("This browser does not support GPS location.");
        inButton.disabled = false;
        outButton.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          document.getElementById("latitude").value =
            position.coords.latitude;
          document.getElementById("longitude").value =
            position.coords.longitude;
          document.getElementById("accuracy").value =
            position.coords.accuracy;
          submitAttendance();
        },
        error => {
          const reasons = {
            1: "Location permission was denied.",
            2: "Your location could not be determined.",
            3: "Getting your location timed out."
          };
          showMessage((reasons[error.code] || "GPS failed.") +
                      " Enable location and retry.");
          inButton.disabled = false;
          outButton.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    }

    function submitAttendance() {
      if (submitting) return;

      if (!selfieInput.value) {
        showMessage("Please capture your selfie first.");
        inButton.disabled = false;
        outButton.disabled = false;
        return;
      }

      submitting = true;
      document.getElementById("action").value = pendingAction;
      showMessage("Submitting attendance. Please wait…");
      form.submit();
    }

    window.addEventListener("pageshow", () => {
      submitting = false;
      inButton.disabled = false;
      outButton.disabled = false;
    });

    window.addEventListener("beforeunload", stopCamera);
  </script>
</body>
</html>
