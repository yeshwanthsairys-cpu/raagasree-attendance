
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raagasree E.M High School - Staff Attendance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f4fa;
      color: #183153;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 25px auto;
      padding: 28px 24px;
      background: #ffffff;
      border-radius: 16px;
      border-top: 5px solid #c59a43;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 29px;
      margin: 0 0 4px;
      padding: 0;
      color: #183153;
      letter-spacing: 1px;
    }

    .school-name {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin: 0 auto 14px;
      padding: 0;
      color: #183153;
      letter-spacing: 0.5px;
    }

    .subtitle {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 16px;
      margin: 0 0 28px;
      padding: 0;
      color: #a57922;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: #ffffff;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .in-button {
      background: #16834a;
    }

    .out-button {
      background: #2458b8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .note {
      font-size: 13px;
      color: #596579;
      text-align: center;
      margin-top: 22px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #8a6b2d;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="card">

    <h1>RAAGASREE</h1>
    <h2 class="school-name">E.M HIGH SCHOOL</h2>
    <p class="subtitle">STAFF ATTENDANCE 2026–27</p>

    <form
      id="attendanceForm"
      action="https://script.google.com/macros/s/AKfycbxOCdt1KMDUa0GwAY3VdnkC9tnNa8akXSsTqkh9TM5_rHFb-5g5Vdg71_LTlTZYno28ww/exec"
      method="POST"
    >
      <label for="teacherId">Teacher ID</label>
      <input
        id="teacherId"
        name="teacherId"
        type="text"
        placeholder="Enter your Teacher ID"
        required
        autocomplete="username"
      >

      <label for="pin">Attendance PIN</label>
      <input
        id="pin"
        name="pin"
        type="password"
        placeholder="Enter your Attendance PIN"
        required
        autocomplete="current-password"
      >

      <input type="hidden" name="action" id="action">
      <input type="hidden" name="latitude" id="latitude">
      <input type="hidden" name="longitude" id="longitude">
      <input type="hidden" name="accuracy" id="accuracy">

      <button
        type="button"
        class="in-button"
        onclick="submitAttendance('IN')"
      >
        IN-PUNCH
      </button>

      <button
        type="button"
        class="out-button"
        onclick="submitAttendance('OUT')"
      >
        OUT-PUNCH
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="note">
      Please allow location access and mark your attendance
      while at school.
    </p>

  </main>

  <script>
    let submitting = false;

    function submitAttendance(action) {
      if (submitting) return;

      const form = document.getElementById("attendanceForm");
      const message = document.getElementById("message");

      if (!form.reportValidity()) return;

      if (!navigator.geolocation) {
        message.textContent =
          "Your browser does not support GPS location.";
        return;
      }

      submitting = true;

      const buttons = form.querySelectorAll("button");
      buttons.forEach(button => button.disabled = true);

      message.textContent = "Checking your location. Please wait...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          document.getElementById("action").value = action;
          document.getElementById("latitude").value =
            position.coords.latitude;
          document.getElementById("longitude").value =
            position.coords.longitude;
          document.getElementById("accuracy").value =
            position.coords.accuracy;

          message.textContent = "Submitting attendance...";
          form.submit();
        },
        function(error) {
          submitting = false;
          buttons.forEach(button => button.disabled = false);

          if (error.code === 1) {
            message.textContent =
              "Location permission denied. Allow location access in your browser and try again.";
          } else if (error.code === 3) {
            message.textContent =
              "Location request timed out. Please try again.";
          } else {
            message.textContent =
              "Unable to get your location. Turn on GPS and try again.";
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
